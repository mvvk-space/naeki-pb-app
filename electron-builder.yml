# electron-builder config for the Naeki desktop build
# Output: release/ (gitignored). The Neon-backed API server ships as part of
# the app bundle (server/ + node_modules/pg ride along via "files"); main.js
# spawns it with ELECTRON_RUN_AS_NODE on :8090 at launch. The packaged app
# needs $NAEKI_DSN or ~/.config/neon/naeki-sushi.dsn on the target machine.

appId: dev.naeki.app
productName: Naeki Sushi Showcase
copyright: Naeki demo

directories:
  output: release
  buildResources: build

files:
  - main.js
  - package.json
  - server/**/*
  - src/index.html
  - src/styles.css
  - src/sw.js
  - src/manifest.webmanifest
  - src/*.js
  - src/types.d.ts
  - src/assets/**/*
  - node_modules/pg/**/*
  - node_modules/pg-protocol/**/*
  - node_modules/pg-connection-string/**/*
  - node_modules/pg-pool/**/*
  - "!node_modules/@types"

asar: true

linux:
  target:
    - AppImage
  category: Utility
  icon: src/assets/icon.png
  desktop:
    Name: Naeki Sushi Showcase

# demo build — no codesigning, no auto-update channel yet
npmRebuild: false
electronLanguages:
  - en-US