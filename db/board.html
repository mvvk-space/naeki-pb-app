<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naeki · Board (Neon)</title>
<style>
  :root { --ink-0:#101012; --ink-1:#16161a; --ink-2:#1e1e23; --line:#2a2a31; --line-hover:#3d3d46;
          --paper:#f3efe7; --paper-dim:#b9b4a8; --paper-faint:#6d6a62;
          --salmon:#ff8a3c; --wasabi:#9fb83f; --go:#7ea8c9; --gold:#d9a441;
          --plum:#b48ec9; --teal:#6fbfa8; --rose:#d98a8a; --pink:#e05a9b;
          --r:14px; --font:"Noto Sans CJK JP","Noto Sans Thai",system-ui,sans-serif; --mono:ui-monospace,"DejaVu Sans Mono",monospace; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--ink-0); color:var(--paper); font:14px/1.5 var(--font); padding:22px; }
  header { margin-bottom:16px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  h1 { font-size:19px; letter-spacing:.01em; }
  .sub { color:var(--paper-dim); font-size:12px; }
  .src { color:var(--paper-faint); font-size:11px; font-family:var(--mono); }
  .filters { display:flex; gap:8px; margin:0 0 16px; flex-wrap:wrap; }
  .filters button { background:var(--ink-2); color:var(--paper-dim); border:1px solid var(--line);
                    border-radius:999px; padding:4px 12px; font:11px var(--font); cursor:pointer; }
  .filters button[aria-pressed="true"] { color:var(--ink-0); background:var(--paper); border-color:var(--paper); }
  .board { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; align-items:start; }
  .col { background:var(--ink-2); border:1px solid var(--line); border-radius:var(--r); padding:11px; }
  .col h2 { font-size:10px; text-transform:uppercase; letter-spacing:.14em; color:var(--paper-dim);
            margin-bottom:9px; display:flex; justify-content:space-between; }
  .col h2 b { color:var(--paper); font-weight:600; }
  .col.wip { border-color:var(--wasabi); }
  .card { background:var(--ink-1); border:1px solid var(--line); border-radius:12px; padding:9px 10px;
          margin-bottom:7px; cursor:pointer; transition:border-color .12s, transform .12s; }
  .card:hover { border-color:var(--line-hover); transform:translateY(-1px); }
  .card:last-child { margin-bottom:0; }
  .row { display:flex; align-items:center; gap:6px; margin-bottom:5px; flex-wrap:wrap; }
  .tag { font-size:10px; padding:1px 6px; border-radius:999px; border:1px solid var(--line); color:var(--paper-dim); }
  .pri-P0 { color:var(--salmon); border-color:var(--salmon); }
  .pri-P1 { color:var(--gold); border-color:var(--gold); }
  .pri-P2 { color:var(--go); border-color:var(--go); }
  .pid { font-family:var(--mono); font-size:11px; color:var(--paper-faint); }
  .t { font-size:13px; line-height:1.35; }
  .empty { color:var(--paper-faint); font-size:12px; }
  /* drawer */
  .scrim { position:fixed; inset:0; background:#000a; opacity:0; pointer-events:none; transition:opacity .18s; z-index:8; }
  .scrim.on { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:min(560px,94vw); background:var(--ink-1);
            border-left:1px solid var(--line); padding:22px; overflow-y:auto; z-index:9;
            transform:translateX(101%); transition:transform .22s cubic-bezier(.2,.7,.3,1); }
  .drawer.on { transform:none; }
  .drawer h3 { font-size:17px; margin-bottom:4px; line-height:1.3; }
  .drawer .meta { color:var(--paper-dim); font-size:12px; margin-bottom:16px; font-family:var(--mono); }
  .drawer h4 { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--paper-faint);
               margin:16px 0 6px; }
  .drawer p { font-size:13px; color:var(--paper-dim); }
  .drawer ul { margin:0; padding-left:18px; font-size:13px; color:var(--paper-dim); }
  .drawer code { font-family:var(--mono); font-size:12px; color:var(--paper); }
  .drawer .x { position:absolute; top:14px; right:16px; background:none; border:0; color:var(--paper-dim);
               font-size:22px; cursor:pointer; line-height:1; }
  .ev { font-family:var(--mono); font-size:11px; color:var(--paper-faint); border-top:1px solid var(--line);
        padding:5px 0; }
  @media (max-width:820px){ body{padding:14px} .board{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <h1>Naeki · Production Board</h1>
  <span class="sub" id="counts">loading…</span>
  <span class="src" id="src"></span>
</header>
<div class="filters" id="filters"></div>
<div class="board" id="board"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Card detail"></aside>

const DATA = [{"id":"U-1","col":"done","pri":"P1","title":"One sign-in for everyone — remove the 'Partner portal' gate","est":"S","state":"probed","why":"The landing header's 'Partner portal' button opens the exact same sign-in modal as 'Open the app' (both wired to openSignin with no special handling) — a segregated-feeling duplicate that signals staff enter elsewhere. Worse, after sign-in staff are force-routed to the portal (enterApp: isStaff() ? 'partners'; brand-home and defaultView too) and never see the customer app — partners can't dogfood the ordering/rewards flows they're meant to improve, and a franchisee who never sees the customer side never reports its bugs. One sign-in for everyone; role decides what's visible AFTER entry.","verified":"Code read: index.html:106, app.js:66/170-178, app.js openSignin wiring list. No test references #lp-portal-signin (e2e uses #lp-signin only).","resolves":[],"done_steps":["Remove #lp-portal-signin from the landing nav + its openSignin wiring","Staff land where the CTA points (menu/branches) like everyone else; Portal stays one click away via the staff-only nav link","Sign-in modal copy speaks to everyone (no per-role portal talk)","Verify: somchai signs in → lands on Order with Portal link visible; kate → Order, no Portal"],"files":["src/index.html:106","src/app.js:66,170-178,195","src/index.html:1314-1321"],"deps":[],"position":1},{"id":"U-2","col":"done","pri":"P1","title":"Phone shell: staff need a Portal tab","est":"S","state":"probed","why":"At ≤640px the sidebar nav is display:none and the tabbar has only Order · Rewards · Chat — staff on a phone have NO portal entry at all. Today they're auto-dropped into partners and then stranded (no way back); after U-1 they'd have no way in at all. The .staff-only class already exists for exactly this.","verified":"Code read: styles.css:2456+ (#sidebar row layout, .side-nav display:none), index.html:751-771 (tabbar has three buttons).","resolves":[],"done_steps":["Add a staff migrations apply","Re-run the E1-1/E1-2 probes"],"files":["pb_migrations/1789383100_locked_users_signup.js","pb_migrations/1789383101_pinned_users_role.js"],"deps":[],"position":1},{"id":"T-4","col":"inbox","pri":"P0","title":"Backend-down / offline is a blank screen with no retry","est":"M","state":"audited","why":"Every surface now sources from PocketBase at 127.0.0.1:8090, but failures vanish: data.js pbHydrate swallows all errors with a bare catch (:810), pb.js json() returns {ok:false} that most callers ignore, and pollApproved just reschedules on failure (app.js:1654). With PB down the menu/branches/offers silently keep stale defaults or render empty — and the PWA advertises offline support. Nothing tells the user what happened or offers a retry.","verified":"Source audit: pbHydrate try/catch{} (data.js:783-810); json() ok/status never surfaced (pb.js:18-24); only two inline error paths exist (sign-in app.js:225, coupon note :1080). No navigator.onLine use; no offline banner.","resolves":["F7"],"done_steps":["Connectivity/health indicator in both shells: online · backend unreachable · offline","Hydrate retries with backoff + a visible 'reconnecting…' and manual Retry","Empty data surfaces show an error state, never a silent blank"],"files":["src/data.js:783-810","src/pb.js:18-24","src/app.js:1643-1655"],"deps":[],"position":2},{"id":"T-3","col":"inbox","pri":"P1","title":"No visible keyboard focus anywhere","est":"M","state":"audited","why":"The whole app is button/role=button driven, but the button reset (styles.css:95) strips native chrome and every text input kills its outline (:318, :2089, :2230, :2415, :2566) — with zero :focus-visible rules in the file. Dish cards, branch cards, nav rows and steppers are all tab-reachable (tabIndex=0, role=button) yet a keyboard user cannot see which control has focus, so the app is effectively unusable without a mouse.","verified":"Source audit: grep -c focus-visible src/styles.css → 0; five outline:none sites; dishCard sets tabIndex/role (app.js:770-771), branch card (:933-934); the only focus move in a dialog is .modal-x (:1993).","resolves":[],"done_steps":["One global :focus-visible ring (2px salmon, 2px offset) that survives the button reset","Custom controls (dish, branch, chips, steppers) inherit it","e2e/a11y: tab through every view — a focus indicator on each stop"],"files":["src/styles.css:95, :318, :2089, :2230, :2415, :2566","src/app.js:770, :933"],"deps":[],"position":4},{"id":"T-5","col":"inbox","pri":"P1","title":"Modals don't trap or restore focus, and the page scrolls behind","est":"S","state":"audited","why":"openModal only moves focus to the close button (app.js:1993) — Tab then walks out into the page behind the dialog, closing leaves focus nowhere near the dish that opened it, and the background still scrolls under the overlay. #modal and #signin share this. role=dialog/aria-modal is set, so the intent is there; the behavior isn't.","verified":"Source audit: openModal (app.js:1971-1994) focuses .modal-x with no trap or restore; closeModal (:2007) just hides; no body scroll lock on open. Escape closes both (:2009-2012).","resolves":[],"done_steps":["Trap Tab within the open dialog; restore focus to the trigger on close","Lock background scroll while a modal is open","Esc, backdrop and × all behave identically"],"files":["src/app.js:1971-2012","src/index.html:1288-1306"],"deps":[],"position":5},{"id":"T-6","col":"inbox","pri":"P1","title":"Destructive actions fire with no confirm or undo","est":"S","state":"audited","why":"Clear cart (app.js:1162), Reset card (:1961) and coupon remove (:1141) take effect instantly and irreversibly. A cleared cart can be twenty lines of manual rebuilding, and Reset card wipes the whole stamp history log. There is no undo and no confirm — a single mis-tap is permanent.","verified":"Source audit: #cart-clear → S.clearCart() unguarded; #stamp-reset → S.resetCard(); #cpn-remove removes the applied coupon. No confirm()/undo anywhere in src/.","resolves":[],"done_steps":["Undo toast for Clear cart and Reset card (restore the prior store state)","Confirm only where undo is impractical","Keep the destructive affordance visually distinct from accent"],"files":["src/app.js:1141, :1162, :1961","src/store.js (clearCart/resetCard)"],"deps":[],"position":6},{"id":"T-7","col":"inbox","pri":"P1","title":"Search and load have no empty or loading state","est":"M","state":"audited","why":"Filtering the menu to zero matches leaves a blank pane — renderMenu returns early per group and the count reads '0 shown' with no message (app.js:854-865). Branch search behaves the same. And the PB hydrate that swaps the seeded defaults for live rows is invisible: the menu renders defaults, then silently replaces them, so a slow or different backend reads as a flicker rather than loading.","verified":"Source audit: renderMenu `if (!items.length) return` (:858) with no no-results node; count set at :871-874; renderBranches has no empty branch either. No skeleton or aria-busy in src/.","resolves":[],"done_steps":["'No dishes match “…” — clear search' empty states for menu and branches","Skeleton or aria-busy while the first hydrate is in flight","State survives refresh cycles without flashing"],"files":["src/app.js:846-883, :899-981","src/data.js:783-810"],"deps":["T-4"],"position":7},{"id":"T-8","col":"inbox","pri":"P2","title":"Menu images have no fallback and reserve no space","est":"S","state":"audited","why":"dishCard emits <img loading=lazy> with no width/height or aspect box and no onerror (app.js:790). If a PB row carries a bad or missing img the card shows a broken-image icon; before decode the grid reflows. The image set is local and stable today, but PB now drives img paths, so a bad path is one data edit away.","verified":"Source audit: one img tag at app.js:790; CSS sets .dish img aspect-ratio (styles.css:354) but the element declares no dimensions; no onerror handler anywhere in src/.","resolves":[],"done_steps":["onerror → branded placeholder in the same aspect box","Reserve space via width/height or the existing aspect-ratio on the element","Cover menu, featured and modal media"],"files":["src/app.js:790","src/styles.css:354"],"deps":[],"position":8},{"id":"T-2","col":"inbox","pri":"P1","title":"Multi-agent dev-DB contention needs a protocol","est":"S","state":"probed","why":"Two agents hardening the same app both spawn PocketBase on 127.0.0.1:8090 with hooksWatch. Observed this session: one agent's instance held the port ~8 min while the other's probes ran; a broken hook in one agent's file made every promotion create 400 for everyone; pkill -f 'pocketbase serve' matches ANY instance, not just one's own. Silent cross-agent interference is the default, not the exception.","verified":"Live this session: bind conflict at 13:04:47, hook ReferenceError 400s during the other agent's active window, pkill fallout. Cross-edits to in-progress migration files happened (restored).","resolves":[],"done_steps":["Pick a protocol: one designated PB owner at a time (claimed on the board), or per-agent ports (8091/8092) with separate pb_data dirs","Never pkill a broad pattern — kill by session id","Never edit another agent's in-progress files; file triage instead"],"files":["package.json (pb script)","main.js:8"],"deps":[],"position":9},{"id":"E2-1","col":"notnow","pri":"P0","title":"Build the earning engine (pb_hooks)","est":"L","state":"probed","why":"loyalty and user_state rules are just 'owner = @request.auth.id' — the server has no opinion on what's written. Review B POSTed points:999999 directly; the checkout math in store.js:315 is correct but nothing enforces it. The whole top-spenders analytics story is worthless while earning is self-reported.","verified":"Live probe: arbitrary user_state blob PATCH (wallet 999999 / points 999999) accepted → 200, reverted after. Review B: direct POST to loyalty with points:999999 → 200 (rows deleted).","resolves":["F3"],"done_steps":["pb_hooks: h the owner doesn't hold — the server accepted it. Any owner can currently market on any branch's name.","verified":"Reported by Review B (beypkxr9pjh4mrv, deleted). Also re-probe their claim that one owner PATCHed another owner's promo to 'sent' — if the author arm really resolves cross-author, that's a rule engine quirk to document.","resolves":["F2","F7"],"done_steps":["Needs E3-3 (branch relations) first","Rule or hook: @request.body.branch must equal the author's branch; admins exempt","Probe: Somchai composes for BTS Siam → 400"],"files":["src/app.js:482-486","scripts/seed.mjs:94-96 (owner→branch seeding)"],"deps":["E3-3"],"position":2},{"id":"E2-3","col":"notnow","pri":"P0","title":"Atomic coupon redemption hook","est":"M","state":"reported","why":"Every coupon has usedCount:0 forever: checkout never writes it back — and couldn't, since coupon update rules are admin-only (correctly). So usageLimit is decorative and the 'fully claimed' branch (store.js:738) is unreachable. Same class as client-minted money: the brand's ledger lives where the earning path can't touch it.","verified":"Verified by Review B: usedCount frozen at 0 across all coupons despite the redeem flow existing.","resolves":["F4"],"done_steps":["Hook on redemption: transactionally check usedCount < usageLimit then increment + write a per-user coupon_redemption record","Enforce expiry/minSpend/branch server-side (client re-validation stays as UX only)","Test: concurrent redemptions at the limit don't overshoot; exhausted coupon → 'fully claimed' fires"],"files":["src/store.js:738","scripts/seed.mjs:233-265 (coupon schema)"],"deps":["E2-1"],"position":2},{"id":"E7-2","col":"notnow","pri":"P1","title":"BOT / e-money legal review","est":"M","state":"reported","why":"The moment the wallet holds real value you inherit obligations: closed-loop promotional credit is safe territory; open-loop e-money invites Bank of Thailand licensing. Have the conversation before Stage 4, not after.","verified":"Compli const HISTORY = {};
const SRC = "neon:naeki-sushi · rendered 2026-09-16 07:37";
let filter = null;

function render() {
  const by = {};
  for (const c of DATA) (by[c.col] ||= []).push(c);
  const total = DATA.length;
  document.getElementById("counts").textContent =
    total + " cards · " + COLUMNS_PRESENT() + " columns in use";
  document.getElementById("src").textContent = SRC;
  document.getElementById("board").innerHTML = COLS.map(co => {
    const cards = (by[co.id] || []);
    return `<div class="col${co.wip ? " wip" : ""}"><h2><b>${co.num} ${co.name}</b><span>${cards.length}</span></h2>` +
      (cards.length ? cards.map(c => {
        const hidden = filter && c.pri !== filter;
        return `<div class="card" data-id="${c.id}"${hidden ? ' style="display:none"' : ''}>
          <div class="row"><span class="tag pri-${c.pri}">${c.pri}</span>
          <span class="tag">${c.est || "–"}</span><span class="pid">${c.id}</span></div>
          <div class="t">${esc(c.title)}</div></div>`;
      }).join("") : '<div class="empty">nothing here</div>') + "</div>";
  }).join("");
}
function COLUMNS_PRESENT() { return new Set(DATA.map(c => c.col)).size; }
const esc = (s) => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function drawer(card) {
  const d = document.getElementById("drawer");
  const ev = (HISTORY[card.id] || []).map(e =>
    `<div class="ev">${e.at.replace("T"," ").slice(0,16)}  ${e.from_col || "–"} → ${e.to_col || "–"}  ${e.actor}${e.note ? "  // " + esc(e.note) : ""}</div>`).join("");
  d.innerHTML = `<button class="x" aria-label="Close">×</button>
    <h3>${esc(card.title)}</h3>
    <div class="meta">${card.id} · ${card.col} · ${card.pri} · ${card.est || "–"} · ${card.state || "–"}</div>
    ${card.why ? `<h4>Why</h4><p>${esc(card.why)}</p>` : ""}
    ${card.verified ? `<h4>Verified</h4><p>${esc(card.verified)}</p>` : ""}
    ${(card.done_steps || []).length ? `<h4>Done when</h4><ul>${card.done_steps.map(s => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}
    ${(card.files || []).length ? `<h4>Files</h4><ul>${card.files.map(s => `<li><code>${esc(s)}</code></li>`).join("")}</ul>` : ""}
    ${ev ? `<h4>History</h4>${ev}` : ""}`;
  d.classList.add("on");
  document.getElementById("scrim").classList.add("on");
}
function close() {
  document.getElementById("drawer").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");
}
document.addEventListener("click", (e) => {
  if (e.target.closest(".card")) {
    const id = e.target.closest(".card").dataset.id;
    drawer(DATA.find(c => c.id === id));
  } else if (e.target.closest(".x") || e.target.id === "scrim") close();
  else if (e.target.closest(".filters button")) {
    const p = e.target.closest("button").dataset.pri;
    filter = filter === p ? null : p;
    document.querySelectorAll(".filters button").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.pri === filter)));
    render();
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
document.getElementById("filters").innerHTML = ["P0","P1","P2","P3"]
  .map(p => `<button data-pri="${p}" aria-pressed="false">${p}</button>`).join("") +
  `<button data-pri="" aria-pressed="false">all</button>`;
render();
</script>
</body>
</html>
