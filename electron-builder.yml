# electron-builder config for Naeki PB desktop
# Output: release/ (gitignored). The PocketBase binary + migrations ship as
# extraResources so the packaged app can boot its own backend on a fresh machine.
# NOTE: cross-platform builds need each platform's pb binary present
#       (./pocketbase = linux amd64; add pocketbase.exe / pocketbase_darwin
#        alongside and extend extraResources per-platform when packaging there).

appId: dev.naeki.pb
productName: Naeki Sushi Showcase
copyright: Naeki demo

directories:
  output: release
  buildResources: build

files:
  - main.js
  - package.json
  - src/index.html
  - src/styles.css
  - src/sw.js
  - src/manifest.webmanifest
  - src/*.js
  - src/types.d.ts
  - src/assets/**/*

extraResources:
  # the Go backend (PocketBase) rides along; main.js spawns it on :8090
  - from: pocketbase
    to: pocketbase
  - from: pb_migrations
    to: pb_migrations

asar: true

linux:
  target:
    - AppImage
  category: Utility
  icon: src/assets/icon.png
  desktop:
    Name: Naeki Sushi Showcase

# mac/windows targets activate when their pb binaries + icons exist
mac:
  target: []
win:
  target: []

# demo build — no codesigning, no auto-update channel yet
npmRebuild: false
electronLanguages:
  - en-US