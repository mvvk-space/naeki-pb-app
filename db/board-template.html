<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naeki · Board (Neon)</title>
<style>
  :root { --ink-0:#101012; --ink-1:#16161a; --ink-2:#1e1e23; --line:#2a2a31; --line-hover:#3d3d46;
          --paper:#f3efe7; --paper-dim:#b9b4a8; --paper-faint:#6d6a62;
          --salmon:#ff8a3c; --wasabi:#9fb83f; --go:#7ea8c9; --gold:#d9a441;
          --plum:#b48ec9; --teal:#6fbfa8; --rose:#d98a8a; --pink:#e05a9b;
          --r:14px; --font:"Noto Sans CJK JP","Noto Sans Thai",system-ui,sans-serif; --mono:ui-monospace,"DejaVu Sans Mono",monospace; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--ink-0); color:var(--paper); font:14px/1.5 var(--font); padding:22px; }
  header { margin-bottom:16px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  h1 { font-size:19px; letter-spacing:.01em; }
  .sub { color:var(--paper-dim); font-size:12px; }
  .src { color:var(--paper-faint); font-size:11px; font-family:var(--mono); }
  .filters { display:flex; gap:8px; margin:0 0 16px; flex-wrap:wrap; }
  .filters button { background:var(--ink-2); color:var(--paper-dim); border:1px solid var(--line);
                    border-radius:999px; padding:4px 12px; font:11px var(--font); cursor:pointer; }
  .filters button[aria-pressed="true"] { color:var(--ink-0); background:var(--paper); border-color:var(--paper); }
  .board { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; align-items:start; }
  .col { background:var(--ink-2); border:1px solid var(--line); border-radius:var(--r); padding:11px; }
  .col h2 { font-size:10px; text-transform:uppercase; letter-spacing:.14em; color:var(--paper-dim);
            margin-bottom:9px; display:flex; justify-content:space-between; }
  .col h2 b { color:var(--paper); font-weight:600; }
  .col.wip { border-color:var(--wasabi); }
  .card { background:var(--ink-1); border:1px solid var(--line); border-radius:12px; padding:9px 10px;
          margin-bottom:7px; cursor:pointer; transition:border-color .12s, transform .12s; }
  .card:hover { border-color:var(--line-hover); transform:translateY(-1px); }
  .card:last-child { margin-bottom:0; }
  .row { display:flex; align-items:center; gap:6px; margin-bottom:5px; flex-wrap:wrap; }
  .tag { font-size:10px; padding:1px 6px; border-radius:999px; border:1px solid var(--line); color:var(--paper-dim); }
  .pri-P0 { color:var(--salmon); border-color:var(--salmon); }
  .pri-P1 { color:var(--gold); border-color:var(--gold); }
  .pri-P2 { color:var(--go); border-color:var(--go); }
  .pid { font-family:var(--mono); font-size:11px; color:var(--paper-faint); }
  .t { font-size:13px; line-height:1.35; }
  .empty { color:var(--paper-faint); font-size:12px; }
  /* drawer */
  .scrim { position:fixed; inset:0; background:#000a; opacity:0; pointer-events:none; transition:opacity .18s; z-index:8; }
  .scrim.on { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:min(560px,94vw); background:var(--ink-1);
            border-left:1px solid var(--line); padding:22px; overflow-y:auto; z-index:9;
            transform:translateX(101%); transition:transform .22s cubic-bezier(.2,.7,.3,1); }
  .drawer.on { transform:none; }
  .drawer h3 { font-size:17px; margin-bottom:4px; line-height:1.3; }
  .drawer .meta { color:var(--paper-dim); font-size:12px; margin-bottom:16px; font-family:var(--mono); }
  .drawer h4 { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--paper-faint);
               margin:16px 0 6px; }
  .drawer p { font-size:13px; color:var(--paper-dim); }
  .drawer ul { margin:0; padding-left:18px; font-size:13px; color:var(--paper-dim); }
  .drawer code { font-family:var(--mono); font-size:12px; color:var(--paper); }
  .drawer .x { position:absolute; top:14px; right:16px; background:none; border:0; color:var(--paper-dim);
               font-size:22px; cursor:pointer; line-height:1; }
  .ev { font-family:var(--mono); font-size:11px; color:var(--paper-faint); border-top:1px solid var(--line);
        padding:5px 0; }
  @media (max-width:820px){ body{padding:14px} .board{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <h1>Naeki · Production Board</h1>
  <span class="sub" id="counts">loading…</span>
  <span class="src" id="src"></span>
</header>
<div class="filters" id="filters"></div>
<div class="board" id="board"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Card detail"></aside>
<script>
/* Generated from Neon. The only hand-written part is this rendering layer;
   all board state comes from the `board_index` / `card` views.
   To republish:  node scripts/board-render.mjs   (writes db/board.html)   */
const COLS = [
  { id:"inbox",  num:"01", name:"Inbox",       wip:false },
  { id:"prog",   num:"02", name:"In progress", wip:true  },
  { id:"notnow", num:"03", name:"Not now",     wip:false },
  { id:"done",   num:"04", name:"Done",        wip:false }
];
/*__DATA__*/
/*__HISTORY__*/
/*__SRC__*/
let filter = null;

function render() {
  const by = {};
  for (const c of DATA) (by[c.col] ||= []).push(c);
  const total = DATA.length;
  document.getElementById("counts").textContent =
    total + " cards · " + COLUMNS_PRESENT() + " columns in use";
  document.getElementById("src").textContent = SRC;
  document.getElementById("board").innerHTML = COLS.map(co => {
    const cards = (by[co.id] || []);
    return `<div class="col${co.wip ? " wip" : ""}"><h2><b>${co.num} ${co.name}</b><span>${cards.length}</span></h2>` +
      (cards.length ? cards.map(c => {
        const hidden = filter && c.pri !== filter;
        return `<div class="card" data-id="${c.id}"${hidden ? ' style="display:none"' : ''}>
          <div class="row"><span class="tag pri-${c.pri}">${c.pri}</span>
          <span class="tag">${c.est || "–"}</span><span class="pid">${c.id}</span></div>
          <div class="t">${esc(c.title)}</div></div>`;
      }).join("") : '<div class="empty">nothing here</div>') + "</div>";
  }).join("");
}
function COLUMNS_PRESENT() { return new Set(DATA.map(c => c.col)).size; }
const esc = (s) => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function drawer(card) {
  const d = document.getElementById("drawer");
  const ev = (HISTORY[card.id] || []).map(e =>
    `<div class="ev">${e.at.replace("T"," ").slice(0,16)}  ${e.from_col || "–"} → ${e.to_col || "–"}  ${e.actor}${e.note ? "  // " + esc(e.note) : ""}</div>`).join("");
  d.innerHTML = `<button class="x" aria-label="Close">×</button>
    <h3>${esc(card.title)}</h3>
    <div class="meta">${card.id} · ${card.col} · ${card.pri} · ${card.est || "–"} · ${card.state || "–"}</div>
    ${card.why ? `<h4>Why</h4><p>${esc(card.why)}</p>` : ""}
    ${card.verified ? `<h4>Verified</h4><p>${esc(card.verified)}</p>` : ""}
    ${(card.done_steps || []).length ? `<h4>Done when</h4><ul>${card.done_steps.map(s => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}
    ${(card.files || []).length ? `<h4>Files</h4><ul>${card.files.map(s => `<li><code>${esc(s)}</code></li>`).join("")}</ul>` : ""}
    ${ev ? `<h4>History</h4>${ev}` : ""}`;
  d.classList.add("on");
  document.getElementById("scrim").classList.add("on");
}
function close() {
  document.getElementById("drawer").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");
}
document.addEventListener("click", (e) => {
  if (e.target.closest(".card")) {
    const id = e.target.closest(".card").dataset.id;
    drawer(DATA.find(c => c.id === id));
  } else if (e.target.closest(".x") || e.target.id === "scrim") close();
  else if (e.target.closest(".filters button")) {
    const p = e.target.closest("button").dataset.pri;
    filter = filter === p ? null : p;
    document.querySelectorAll(".filters button").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.pri === filter)));
    render();
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
document.getElementById("filters").innerHTML = ["P0","P1","P2","P3"]
  .map(p => `<button data-pri="${p}" aria-pressed="false">${p}</button>`).join("") +
  `<button data-pri="" aria-pressed="false">all</button>`;
render();
</script>
</body>
</html>
