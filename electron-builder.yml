# electron-builder config for the Naeki desktop build
# Output: release/ (gitignored). The API server ships bundled as
# out/main/api.js (electron-vite builds server/api.ts as a second main
# entry); src/main/index.ts spawns it with ELECTRON_RUN_AS_NODE on :8090 at
# launch. Production deps (pg, drizzle-orm) ride along in node_modules
# automatically — no hand-vendored list anymore. The packaged app needs
# $NAEKI_DSN or ~/.config/neon/naeki-sushi.dsn on the target machine.

appId: dev.naeki.app
productName: Naeki Sushi Showcase
copyright: Naeki demo

directories:
  output: release
  buildResources: build

files:
  - package.json
  - out/**/*
  - "!node_modules/@types"

asar: true

linux:
  target:
    - AppImage
  category: Utility
  icon: src/assets/icon.png
  desktop:
    Name: Naeki Sushi Showcase

# demo build — no codesigning, no auto-update channel yet
npmRebuild: false
electronLanguages:
  - en-US